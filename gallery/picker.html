<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>叁笙画风手册 · 选画风</title>
<meta name="description" content="逛画风、看色卡，选好后复制一行码交给 Agent；可以设为长期默认，也可以只用一次。">
<style>
:root{--bg:#05080D;--bg2:#0B1018;--green:#0E9F6E;--green2:#34D399;--gold:#E8B84B;--ink:#E4EAF1;--ink2:#B6C0CE;--soft:#8A94A6;--line:rgba(232,238,245,.10);
--card:rgba(13,18,26,.55);--card2:rgba(255,255,255,.04);--ctl:rgba(255,255,255,.06);--warn:#F2A1A1;--shadow:0 10px 30px -14px rgba(0,0,0,.7);
--font:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F3F6F5;--bg2:#E8EEEC;--ink:#15202B;--ink2:#3C4A57;--soft:#66727F;--line:rgba(21,32,43,.12);--card:rgba(255,255,255,.78);--card2:rgba(21,32,43,.04);--ctl:rgba(21,32,43,.06);--shadow:0 10px 26px -16px rgba(20,40,60,.35)}}
:root[data-theme="light"]{--bg:#F3F6F5;--bg2:#E8EEEC;--ink:#15202B;--ink2:#3C4A57;--soft:#66727F;--line:rgba(21,32,43,.12);--card:rgba(255,255,255,.78);--card2:rgba(21,32,43,.04);--ctl:rgba(21,32,43,.06);--shadow:0 10px 26px -16px rgba(20,40,60,.35)}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:15px/1.65 var(--font);background:radial-gradient(1200px 600px at 12% -10%,rgba(14,159,110,.16),transparent 60%),radial-gradient(900px 500px at 100% 0,rgba(232,184,75,.08),transparent 55%),var(--bg);min-height:100vh;padding-bottom:40px}
a{color:inherit}
.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(18px) saturate(135%);-webkit-backdrop-filter:blur(18px) saturate(135%);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{font-weight:800;font-size:17px;text-decoration:none;letter-spacing:.02em}.brand b{color:var(--green2)}
.crumb{color:var(--soft);font-size:13px}.crumb a{text-decoration:none}.crumb a:hover{color:var(--green2)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--ctl);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--green)}
.btn.primary{background:linear-gradient(135deg,var(--green),#0b8a5e);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.gold{background:linear-gradient(135deg,#E8B84B,#c99a2e);border-color:transparent;color:#221a05}
.btn:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--gold);color:#221a05;font-size:12px;font-weight:800;text-align:center}
main{max-width:1240px;margin:0 auto;padding:0 20px}
.hero{padding:34px 0 10px}
h1{margin:0 0 10px;font-size:40px;line-height:1.15;letter-spacing:.01em}
.lead{margin:0;max-width:62ch;color:var(--ink2);font-size:16px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{padding:5px 14px;border:1px solid var(--line);border-radius:999px;color:var(--ink2);font-size:13px;background:var(--card2)}.stat b{color:var(--green2);font-size:15px;margin-right:2px}
.tabs{display:flex;gap:6px;margin:22px 0 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;color:var(--soft);font:inherit;font-size:16px;font-weight:700;padding:10px 18px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green2)}
.toolbar{position:sticky;top:55px;z-index:20;padding:14px 0 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{color:var(--soft);font-size:13px;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--ctl);color:var(--ink);font:inherit;font-size:14px;padding:7px 15px;border-radius:999px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip.small{font-size:13px;padding:5px 12px}
.search{flex:1;min-width:160px;max-width:300px;font:inherit;font-size:14px;color:var(--ink);background:var(--ctl);border:1px solid var(--line);border-radius:999px;padding:7px 16px}
.search:focus{outline:2px solid var(--green);outline-offset:1px}
.note{margin:12px 0 4px;padding:12px 16px;border-left:3px solid var(--green2);background:var(--card2);border-radius:0 12px 12px 0;color:var(--ink2);font-size:14.5px}
.sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}.sec h2{margin:0;font-size:18px}.sec span{color:var(--soft);font-size:13px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--min,240px),1fr));gap:16px}
.card{position:relative;text-align:left;padding:0;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px;overflow:hidden;cursor:pointer;color:var(--ink);font:inherit;box-shadow:var(--shadow);transition:transform .18s,border-color .18s}
.card:hover{transform:translateY(-3px);border-color:var(--green)}
.card:focus-visible,.chip:focus-visible,.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--green2);outline-offset:2px}
.card.dim{opacity:.72}
.card img{display:block;width:100%;background:var(--bg2);aspect-ratio:var(--ar,1)}
.card .t{padding:10px 14px 13px}
.card .n{font-weight:800;font-size:15.5px;line-height:1.35}
.card .c{font-family:var(--mono);font-size:12px;color:var(--green2);margin-right:8px;font-weight:700}
.card .o{margin-top:3px;font-size:12.5px;color:var(--soft);line-height:1.45;min-height:1.45em}
.tag{position:absolute;top:10px;left:10px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(5,8,13,.72);color:#fff;border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px)}
.tag.def{background:var(--green);border-color:transparent}.tag.mine{background:var(--gold);color:#221a05;border-color:transparent;left:auto;right:10px}
.empty{padding:40px;text-align:center;color:var(--soft)}
/* 色卡 */
.pgroup{margin:28px 0 12px;display:flex;align-items:baseline;gap:12px}.pgroup h2{margin:0;font-size:20px}.pgroup span{color:var(--soft);font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.pcard{border:1px solid var(--line);background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.pbar{display:flex;height:84px}.pbar i{flex:1;display:block}
.pbody{padding:14px 16px 16px}
.pname{font-size:20px;font-weight:800;line-height:1.3}.pen{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-top:2px}
.pstory{margin:10px 0 10px;color:var(--ink2);font-size:14.5px}
.pcols{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--soft)}.pcols span{display:inline-flex;align-items:center;gap:6px}.pcols i{width:11px;height:11px;border-radius:50%;border:1px solid var(--line);display:inline-block}
.pact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pprev{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.pprev img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--bg2);display:block}
/* 详情 */
dialog{border:0;padding:0;background:transparent;max-width:min(1120px,96vw);width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(2,4,8,.72);backdrop-filter:blur(6px)}
.dlg{background:var(--bg2);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 80px -20px #000;overflow:hidden;position:relative}
.dlg-x{position:absolute;top:12px;right:14px;z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--ctl);color:var(--ink);font-size:20px;cursor:pointer}
.dlg-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);max-height:92vh}
.viewer{padding:22px;background:var(--bg);display:flex;flex-direction:column;gap:12px;overflow:auto;justify-content:flex-start}
.main-img{width:100%;border-radius:14px;background:var(--bg2);display:block;max-height:64vh;object-fit:contain}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{border:2px solid transparent;background:var(--ctl);border-radius:10px;padding:0;cursor:pointer;width:84px;overflow:hidden;color:var(--ink);font:inherit}
.thumb[aria-pressed="true"]{border-color:var(--green2)}
.thumb img{width:100%;height:62px;object-fit:cover;display:block}.thumbs{max-height:132px;overflow:auto}.thumb span{display:block;font-size:11px;color:var(--soft);padding:2px 4px;text-align:center}
.vhint{font-size:12.5px;color:var(--soft);min-height:1.2em}
.info{padding:26px 28px 22px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.ttl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-right:40px}.ttl h2{margin:0;font-size:26px}.ttl .code{font-family:var(--mono);color:var(--green2);font-weight:800}
.pill{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--gold)}
.origin{margin:2px 0 0;color:var(--ink2)}.origin b{color:var(--ink)}.ess{margin:2px 0 6px;color:var(--soft);font-size:13.5px}
h3{margin:14px 0 6px;font-size:14px;letter-spacing:.06em;color:var(--green2)}
.palstrip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.pchip{flex:0 0 auto;width:118px;scroll-snap-align:start;border:2px solid var(--line);background:var(--card2);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;color:var(--ink);font:inherit;text-align:left}
.pchip[aria-pressed="true"]{border-color:var(--green2)}.pchip:disabled{opacity:.35;cursor:not-allowed}
.pchip .bar{display:flex;height:26px}.pchip .bar i{flex:1}.pchip .bar.orig{background:repeating-linear-gradient(45deg,var(--ctl) 0 6px,transparent 6px 12px)}
.pchip span{display:block;font-size:12.5px;padding:5px 8px;line-height:1.3}
.tune{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}.tune .row{gap:5px}
.hex{width:100%;font:inherit;font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--ctl);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.codebar{font-family:var(--mono);font-size:14.5px;font-weight:700;color:var(--green2);background:rgba(14,159,110,.12);border:1px solid rgba(14,159,110,.35);border-radius:12px;padding:11px 14px;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.actions .btn{flex:1;min-width:150px;padding:11px 16px}
p.small{font-size:12.5px;color:var(--soft);margin:8px 0 0}.btn.sm{font-size:13px;padding:6px 14px}
/* 我的默认 */
.tray{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:40;background:var(--bg2);border-left:1px solid var(--line);box-shadow:-20px 0 60px -20px #000;padding:20px;display:flex;flex-direction:column;gap:12px;transform:translateX(105%);transition:transform .25s}
.tray.open{transform:none}.tray h2{margin:0;font-size:20px}
.tlist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.titem{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.titem img{width:64px;height:48px;object-fit:cover;border-radius:8px;background:var(--bg)}
.titem .u{font-size:12.5px;color:var(--soft)}.titem .s{font-weight:700;font-size:14.5px}.titem code{font-family:var(--mono);font-size:12px;color:var(--green2)}
.titem button{margin-left:auto;border:0;background:none;color:var(--soft);font-size:18px;cursor:pointer}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(2,4,8,.5)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:90vw}
@media (max-width:820px){
 h1{font-size:30px}.top-in{padding:8px 14px}.crumb{display:none}main{padding:0 14px}
 .toolbar{top:50px}.row.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.row.scroll .chip{flex:0 0 auto}
 .grid{gap:12px}
 .dlg-grid{grid-template-columns:1fr;max-height:94vh;overflow:auto}.viewer{padding:14px}.info{padding:18px 18px 22px;overflow:visible}.main-img{max-height:40vh}
 .tab{padding:10px 12px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="/">叁笙早安 <b>AI</b></a>
  <nav class="crumb"><a href="/">首页</a> · <a href="/tools/">百宝箱</a> · 画风手册</nav>
  <span class="sp"></span>
  <button class="btn" id="trayBtn" aria-haspopup="dialog">我的默认<span class="badge" id="trayN">0</span></button>
</div></header>
<main>
<section class="hero">
  <h1>画风手册</h1>
  <p class="lead" id="lead"></p>
  <div class="stats" id="stats"></div>
</section>
<div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="styles" aria-selected="true">选画风</button><button class="tab" role="tab" data-tab="palettes" aria-selected="false">看色卡</button></div>

<section id="stylesTab">
  <div class="toolbar">
    <div class="row scroll" id="uses" aria-label="用途"></div>
    <div class="row" style="margin-top:10px"><span class="lbl">看图角度</span><div class="row" id="angles"></div><span class="sp"></span><input class="search" id="q" type="search" placeholder="搜画风名或原作，如：宫崎骏" aria-label="搜索画风"></div>
  </div>
  <div class="note" id="useNote"></div>
  <div id="grids"></div>
</section>

<section id="palTab" hidden>
  <div class="note">每个色系都有名字和故事，像一年一度的流行色。挑中了点「用这个色系」，之后在画风详情里会默认选中它；也可以先「试色」看它落在画面上的样子。</div>
  <div id="pals"></div>
</section>
</main>

<dialog id="dlg" aria-label="画风详情"><div class="dlg">
  <button class="dlg-x" id="dlgX" aria-label="关闭">×</button>
  <div class="dlg-grid">
    <div class="viewer"><div class="row" id="grpTabs"></div><img class="main-img" id="mainImg" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><div class="thumbs" id="thumbs"></div><div class="vhint" id="vhint"></div></div>
    <div class="info">
      <div class="ttl"><span class="code" id="dCodeTag"></span><h2 id="dName"></h2><span class="pill">试用中</span></div>
      <p class="origin" id="dOrigin"></p><p class="ess" id="dEss"></p>
      <h3>① 用在哪</h3><div class="row" id="dUses"></div><p class="small" id="dUseNote"></p>
      <h3>② 色彩</h3><div class="palstrip" id="dPals"></div>
      <div class="tune" id="tune" hidden><div class="row" id="lightSeg"></div><div class="row" id="satSeg"></div></div>
      <div id="brand" hidden style="margin-top:8px"><input class="hex" id="hex" placeholder="品牌色 HEX，1 到 5 个，如 1F6F8B F4F1E8" aria-label="品牌色"></div>
      <p class="small" id="palNote"></p>
      <h3>③ 怎么用</h3>
      <div class="codebar" id="dCode"></div>
      <div class="actions"><button class="btn gold" id="btnDefault">设为我的默认</button><button class="btn primary" id="btnOnce">只用这一次</button></div>
      <p class="small">「设为我的默认」记在这个浏览器里，攒几个之后从右上角「我的默认」一次复制给 Agent；「只用这一次」直接复制，不改你的默认。</p>
    </div>
  </div>
</div></dialog>

<div class="scrim" id="scrim" hidden></div>
<aside class="tray" id="tray" aria-label="我的默认"><h2>我的默认</h2>
  <p class="small" style="margin:0">这里是你为每个用途挑的画风。复制给 Agent 后，它会记成长期偏好；以后做对应的内容，你没特别说明就用它。</p>
  <div class="tlist" id="tlist"></div>
  <div class="actions"><button class="btn primary" id="tCopy">复制给 Agent</button><button class="btn" id="tClear">清空</button></div>
  <button class="btn" id="tClose">关闭</button>
</aside>

<script id="meta" type="application/json">__META__</script>
<script>
const M=JSON.parse(document.getElementById('meta').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BASE=(()=>{const p=location.pathname;return /\/$|\.html?$/.test(p)?p.replace(/[^/]*$/,''):p+'/';})();
const IMG=(id,k)=>BASE+'img/'+id+'-'+k+'.webp';
const cand=id=>M.cands.find(c=>c.id===id);
const scene=id=>M.scenes.find(s=>s.id===id);
const pal=id=>M.pals.find(p=>p.id===id);
const S={grp:null,tab:'styles',scene:null,angle:'use',q:'',sel:null,useFor:null,pal:'orig',light:0,sat:0,hex:[],img:null};
let mine={};
try{mine=JSON.parse(localStorage.getItem('sb-mine')||'{}')||{};}catch(e){mine={};}
const saveMine=()=>{try{localStorage.setItem('sb-mine',JSON.stringify(mine));}catch(e){}};
const GROUPS=['甜美','自然','东方','都市','怀旧'];
const IMG_GROUPS=[['cv','封面'],['xhs','小红书'],['wxi','横版插图'],['inf','竖版信息图'],['ppt','PPT'],['comic','漫画'],['same','同题对比'],['anchor','原作参考']];
const GROUP_KINDS={cv:['cv'],xhs:['xhs'],wxi:['wxi'],inf:['inf'],ppt:['ppt'],comic:['cm','cp','cs','cw'],same:['s1','s2','s3'],anchor:['anchor']};
const baseKind=k=>k.replace(/-\d+$/,'');
const groupOf=k=>{const b=baseKind(k);return Object.keys(GROUP_KINDS).find(g=>GROUP_KINDS[g].includes(b));};
function stems(c,g){const out=[];GROUP_KINDS[g].forEach(b=>{if(c.imgs.includes(b))out.push(b);for(let i=2;i<=9;i++)if(c.imgs.includes(b+'-'+i))out.push(b+'-'+i);});return out;}
function stemLabel(k){const b=baseKind(k),n=(k.match(/-(\d+)$/)||[])[1];const t=b==='anchor'?'原作参考':(M.kinds[b]||b);return n?t+' '+n:t+(n===undefined&&(M.kinds[b]&&['xhs','wxi','inf','ppt'].includes(b))?' 1':'');}
/* ---------- 状态 ↔ 网址 ---------- */
function readHash(){const p=new URLSearchParams(location.hash.slice(1));
 S.tab=p.get('tab')==='palettes'?'palettes':'styles';
 const u=p.get('u');S.scene=scene(u)?u:(u==='all'?null:M.first);
 S.sel=cand(p.get('s'))?p.get('s'):null;
 S.pal=pal(p.get('p'))?p.get('p'):'orig';
 S.light=[-1,0,1].includes(+p.get('l'))?+p.get('l'):0;S.sat=[-1,0,1].includes(+p.get('t'))?+p.get('t'):0;
 S.hex=(p.get('h')||'').split('.').filter(x=>/^[0-9A-Fa-f]{6}$/.test(x)).map(x=>x.toUpperCase()).slice(0,5);if(S.hex.length)S.pal='brand';}
function writeHash(){const p=new URLSearchParams();if(S.tab==='palettes')p.set('tab','palettes');p.set('u',S.scene||'all');if(S.sel)p.set('s',S.sel);
 if(S.pal!=='orig'&&S.pal!=='brand')p.set('p',S.pal);if(S.light)p.set('l',S.light);if(S.sat)p.set('t',S.sat);if(S.hex.length)p.set('h',S.hex.join('.'));
 try{history.replaceState(null,'','#'+p.toString());}catch(e){}}
/* ---------- 头部 ---------- */
function renderHead(){
 $('lead').textContent='先逛，再选，最后复制一行码交给你的 Agent。'+M.cands.length+' 种画风都标明了原作出处；'+M.pals.filter(p=>p.colors.length).length+' 种色系各有名字和故事。';
 $('stats').innerHTML='<span class="stat"><b>'+M.cands.length+'</b>种画风</span><span class="stat"><b>'+M.pals.filter(p=>p.colors.length).length+'</b>种色系</span><span class="stat"><b>'+M.scenes.length+'</b>种用途</span>';
 const n=Object.keys(mine).length;$('trayN').textContent=n;}
/* ---------- 选画风 ---------- */
function sampleKind(c){
 if(S.angle!=='use')return c.imgs.includes(S.angle)?S.angle:'s1';
 const sc=S.scene?scene(S.scene):null;const k=sc?sc.sample:'s1';return c.imgs.includes(k)?k:'s1';}
function kindRatio(k){return M.ratios[k]||1;}
function minWidth(r){return r>2?360:r>1.5?310:r<0.9?210:250;}
function renderUses(){
 $('uses').innerHTML='<button class="chip" data-u="all" aria-pressed="'+(S.scene===null)+'">全部用途</button>'+M.scenes.map(s=>'<button class="chip" data-u="'+s.id+'" aria-pressed="'+(S.scene===s.id)+'">'+esc(s.name)+'</button>').join('');
 const a=[['use','本用途样图'],['s1','人物'],['s2','物件'],['s3','信息图']];
 $('angles').innerHTML=a.map(([k,t])=>'<button class="chip small" data-a="'+k+'" aria-pressed="'+(S.angle===k)+'" '+(k==='use'&&!S.scene?'disabled':'')+'>'+t+'</button>').join('');
 const sc=S.scene?scene(S.scene):null;$('useNote').textContent=sc?sc.note:'这里是全部画风。选一个用途，会换成那个用途最需要看的样图，并把适合的排在前面；不选也可以直接逛。';}
function matches(c){const q=S.q.trim().toLowerCase();return !q||(c.name+' '+c.origin+' '+c.id+' '+c.family).toLowerCase().includes(q);}
function cardHtml(c,opts){
 const k=sampleKind(c);const r=kindRatio(k);
 const isMine=S.scene&&mine[S.scene]&&mine[S.scene].style===c.id;
 return '<button class="card'+(opts.dim?' dim':'')+'" data-s="'+c.id+'" style="--ar:'+r+'"><img loading="lazy" decoding="async" alt="'+esc(c.name)+' 样图" src="'+IMG(c.id,k)+'">'
  +(opts.tag?'<span class="tag def">'+opts.tag+'</span>':'')+(isMine?'<span class="tag mine">我的默认</span>':'')
  +'<div class="t"><div><span class="c">'+c.id+'</span><span class="n">'+esc(c.name)+'</span></div><div class="o">'+esc(c.origin||' ')+'</div></div></button>';}
function gridHtml(list,opts){return list.length?'<div class="grid" style="--min:'+minWidth(kindRatio(sampleKind(list[0])))+'px">'+list.map(c=>cardHtml(c,opts(c))).join('')+'</div>':'';}
function renderGrids(){
 const sc=S.scene?scene(S.scene):null;let html='';
 if(!sc){const list=M.cands.filter(matches);html=list.length?'<div class="sec"><h2>全部画风</h2><span>'+list.length+' 种</span></div>'+gridHtml(list,()=>({})):'';}
 else{
  const pool=sc.pool.filter(id=>id!==sc.default);
  const dflt=cand(sc.default);const rec=pool.map(cand).filter(Boolean).filter(matches);
  const rest=M.cands.filter(c=>!sc.pool.includes(c.id)).filter(matches);
  const first=[dflt].filter(x=>x&&matches(x));
  const tops=first.concat(rec);
  if(tops.length)html+='<div class="sec"><h2>适合「'+esc(sc.name)+'」</h2><span>'+tops.length+' 种，第一张是默认推荐</span></div>'+gridHtml(tops,c=>({tag:c.id===sc.default?'默认':''}));
  if(rest.length)html+='<div class="sec"><h2>其余画风也能试试</h2><span>'+rest.length+' 种，没有特别标为适合，但都能用</span></div>'+gridHtml(rest,()=>({dim:true}));}
 $('grids').innerHTML=html||'<div class="empty">没有找到匹配的画风，换个词试试。</div>';}
/* ---------- 色卡 ---------- */
function renderPals(){
 let html='';
 GROUPS.forEach(g=>{const list=M.pals.filter(p=>p.group===g);if(!list.length)return;
  html+='<div class="pgroup"><h2>'+g+'</h2><span>'+list.length+' 种</span></div><div class="pgrid">'+list.map(p=>
   '<div class="pcard" data-p="'+p.id+'"><div class="pbar">'+p.colors.map(c=>'<i style="background:'+c.hex+'"></i>').join('')+'</div><div class="pbody"><div class="pname">'+esc(p.name)+'</div><div class="pen">'+esc(p.en)+'</div><p class="pstory">'+esc(p.story)+'</p><div class="pcols">'+p.colors.map(c=>'<span><i style="background:'+c.hex+'"></i>'+esc(c.name.split(' ')[0])+' '+c.hex+'</span>').join('')+'</div><div class="pact"><button class="btn sm" data-try="'+p.id+'">试色</button><button class="btn primary sm" data-usepal="'+p.id+'">'+(S.pal===p.id?'已选用':'用这个色系')+'</button></div><div class="pprev" hidden></div></div></div>').join('')+'</div>';});
 $('pals').innerHTML=html;}
/* ---------- 色调示意（浏览器端，亮度渐变映射） ---------- */
const lum=h=>{const n=parseInt(h.slice(1),16);return .2126*(n>>16&255)+.7152*(n>>8&255)+.0722*(n&255);};
function ramp(colors){return colors.slice().sort((a,b)=>lum(a.hex)-lum(b.hex)).map(x=>{const n=parseInt(x.hex.slice(1),16);return [n>>16&255,n>>8&255,n&255];});}
function tintImg(img,rp,light,sat){try{const w=img.naturalWidth,h=img.naturalHeight;if(!w||rp.length<2)return;const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.drawImage(img,0,0);const d=x.getImageData(0,0,w,h),a=d.data,k=.62+.12*sat;
 for(let i=0;i<a.length;i+=4){let l=(.2126*a[i]+.7152*a[i+1]+.0722*a[i+2])/255+.09*light;l=Math.min(1,Math.max(0,l));const f=l*(rp.length-1),j=Math.min(rp.length-2,Math.floor(f)),t=f-j;const c0=rp[j],c1=rp[j+1];
  for(let c=0;c<3;c++){a[i+c]=Math.round(a[i+c]*(1-k)+(c0[c]+(c1[c]-c0[c])*t)*k);}}
 x.putImageData(d,0,0);img.src=cv.toDataURL('image/webp',.85);img.dataset.tinted='1';return true;}catch(e){return false;}}
function tintOnLoad(img,cols,light,sat){const rp=ramp(cols);const go=()=>tintImg(img,rp,light,sat);img.complete&&img.naturalWidth?go():img.addEventListener('load',go,{once:true});}
function palColors(){if(S.pal==='brand')return S.hex.map(h=>({hex:'#'+h}));const p=pal(S.pal);return p?p.colors:[];}
const TRY_STYLES=()=>{const free=M.cands.filter(c=>c.recolor==='free'&&c.imgs.includes('s1'));const pick=['C24','C30','C17'].map(cand).filter(c=>c&&c.recolor==='free');return (pick.length===3?pick:free.slice(0,3));};
/* ---------- 详情 ---------- */
function usable(c){return M.scenes.filter(s=>c.uses.includes(s.id));}
function applyCode(){const c=cand(S.sel);if(!c)return '';const u=S.useFor||M.first;let s='sb2:'+u+'/'+c.id;
 if(S.pal==='brand'){if(S.hex.length)s+='-hex.'+S.hex.join('.');}
 else if(S.pal!=='orig'&&c.recolor!=='locked'){s+='-'+S.pal;if(S.light||S.sat)s+='.L'+S.light+'S'+S.sat;}
 return s;}
function codeOk(){return !(S.pal==='brand'&&!S.hex.length);}
function openDetail(id){
 const c=cand(id);if(!c)return;S.sel=id;
 const ok=usable(c).map(s=>s.id);
 if(!S.useFor||!M.scenes.some(s=>s.id===S.useFor)||(S.scene&&S.useFor!==S.scene))S.useFor=S.scene||ok[0]||M.first;
 if(c.recolor==='locked'&&S.pal!=='orig'){S.pal='orig';S.light=0;S.sat=0;S.hex=[];}
 S.grp=null;S.img=sampleKind(c);renderDetail();if(!$('dlg').open)$('dlg').showModal();writeHash();}
function closeDetail(){if($('dlg').open)$('dlg').close();S.sel=null;writeHash();}
function renderDetail(){
 const c=cand(S.sel);if(!c)return;
 $('dCodeTag').textContent=c.id;$('dName').textContent=c.name;
 $('dOrigin').innerHTML=c.origin?'原作灵感：<b>'+esc(c.origin)+'</b>':'';$('dEss').textContent=c.essence;
 const sc=S.useFor?scene(S.useFor):null;
 // 图：按「封面 / 小红书 / 横版插图 / 竖版信息图 / PPT / 漫画 / 同题 / 原作」分组；默认打开本用途那一组
 const avail=IMG_GROUPS.filter(([g])=>stems(c,g).length);
 if(!S.grp||!avail.some(([g])=>g===S.grp)){const want=sc&&c.imgs.includes(sc.sample)?groupOf(sc.sample):null;S.grp=(want&&avail.some(([g])=>g===want))?want:(avail[0]||['same'])[0];}
 const order=stems(c,S.grp);
 if(!order.includes(S.img))S.img=order[0];
 $('grpTabs').innerHTML=avail.map(([g,t])=>'<button class="chip small" data-grp="'+g+'" aria-pressed="'+(g===S.grp)+'">'+t+(stems(c,g).length>1?' · '+stems(c,g).length:'')+'</button>').join('');
 $('thumbs').innerHTML=order.map(k=>'<button class="thumb" data-img="'+k+'" aria-pressed="'+(k===S.img)+'"><img alt="" src="'+IMG(c.id,k)+'"><span>'+esc(stemLabel(k))+'</span></button>').join('');
 const mi=$('mainImg');mi.removeAttribute('data-tinted');mi.alt=c.name+' 样图';mi.src=IMG(c.id,S.img);
 const cols=palColors();const on=!(c.recolor==='locked')&&S.pal!=='orig'&&cols.length>=2&&S.img!=='anchor';
 $('vhint').textContent=on?'样图上的色彩是「色调示意」，按色系粗略映射，正式出图以生成结果为准。':(S.img==='anchor'?'这是原作的风格参考图，不是用这套手册生成的。':'');
 if(on)tintOnLoad(mi,cols,S.light,S.sat);
 // 用途
 $('dUses').innerHTML=M.scenes.map(s=>{const good=c.uses.includes(s.id);return '<button class="chip small" data-for="'+s.id+'" aria-pressed="'+(S.useFor===s.id)+'">'+esc(s.name)+(good?'':'<em style="opacity:.6;font-style:normal"> · 未标适合</em>')+'</button>';}).join('');
 $('dUseNote').textContent=sc?sc.note:'';
 // 色彩
 const locked=c.recolor==='locked';
 $('dPals').innerHTML=M.pals.map(p=>{const dis=locked&&p.id!=='orig';const bar=p.id==='orig'?'<div class="bar orig"></div>':'<div class="bar">'+p.colors.map(x=>'<i style="background:'+x.hex+'"></i>').join('')+'</div>';return '<button class="pchip" data-p="'+p.id+'" aria-pressed="'+(S.pal===p.id)+'" '+(dis?'disabled':'')+'>'+bar+'<span>'+esc(p.name)+'</span></button>';}).join('');
 const named=S.pal!=='orig'&&S.pal!=='brand'&&!locked;$('tune').hidden=!named;$('brand').hidden=S.pal!=='brand';
 const seg=(el,cur,key,label,items)=>{el.innerHTML='<span class="lbl">'+label+'</span>'+items.map(([v,t])=>'<button class="chip small" data-k="'+key+'" data-v="'+v+'" aria-pressed="'+(cur===v)+'">'+t+'</button>').join('');};
 seg($('lightSeg'),S.light,'light','深浅',[[1,'浅'],[0,'标准'],[-1,'深']]);seg($('satSeg'),S.sat,'sat','鲜灰',[[-1,'柔和'],[0,'标准'],[1,'鲜艳']]);
 $('hex').value=S.hex.join(' ');
 $('palNote').textContent=locked?'这个画风的色彩是设计的一部分（'+(c.recolorNote||'锁定')+'），不能换色系。':(c.recolor==='lightness_only'?'这个画风只适合调整深浅，不建议换色系。':'');
 renderCodeBar();}
function renderCodeBar(){const ok=codeOk();$('dCode').textContent=ok?applyCode():'先填品牌色 HEX';$('btnDefault').disabled=!ok;$('btnOnce').disabled=!ok;}
/* ---------- 复制与默认 ---------- */
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
async function copy(text,done){try{await navigator.clipboard.writeText(text);toast(done);}catch(e){prompt('复制下面这段',text);}}
function onceText(){const sc=scene(S.useFor);const code=applyCode();return code+'\n（这次「'+sc.name+'」用上面这个画风，只用这一次，不要改我的默认设置。）';}
function saveDefault(){const c=cand(S.sel),sc=scene(S.useFor);if(!c||!sc)return;mine[sc.id]={style:c.id,code:applyCode(),name:c.name};saveMine();renderHead();renderGrids();toast('已设为「'+sc.name+'」的默认，右上角「我的默认」里可以汇总复制');}
function defaultsText(){const ids=Object.keys(mine);const lines=ids.map(id=>'- '+scene(id).name+'　'+mine[id].code);
 return '请把下面设为我的叁笙画风手册默认（长期有效：以后做对应内容，我没特别说明就用它）：\n'+lines.join('\n');}
function renderTray(){
 const ids=Object.keys(mine).filter(id=>scene(id));
 $('tlist').innerHTML=ids.length?ids.map(id=>'<div class="titem"><img alt="" src="'+IMG(mine[id].style,sampleKindFor(mine[id].style,id))+'"><div><div class="u">'+esc(scene(id).name)+'</div><div class="s">'+esc(mine[id].name)+'</div><code>'+esc(mine[id].code)+'</code></div><button data-rm="'+id+'" aria-label="移除">×</button></div>').join(''):'<div class="empty">还没有默认。在画风详情里点「设为我的默认」，这里会汇总成一段话，复制给 Agent 就行。</div>';
 $('tCopy').disabled=!ids.length;$('tClear').disabled=!ids.length;}
function sampleKindFor(styleId,sceneId){const c=cand(styleId),sc=scene(sceneId);return c&&sc&&c.imgs.includes(sc.sample)?sc.sample:'s1';}
function openTray(o){$('tray').classList.toggle('open',o);$('scrim').hidden=!o;if(o)renderTray();}
/* ---------- 页面切换与事件 ---------- */
function renderAll(){renderHead();renderUses();renderGrids();
 $('stylesTab').hidden=S.tab!=='styles';$('palTab').hidden=S.tab!=='palettes';
 document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===S.tab));
 if(S.tab==='palettes')renderPals();writeHash();}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;renderAll();}
 else if(t.dataset.u){S.scene=t.dataset.u==='all'?null:t.dataset.u;if(!S.scene&&S.angle==='use')S.angle='s1';S.useFor=S.scene||S.useFor;renderAll();}
 else if(t.dataset.a){S.angle=t.dataset.a;renderAll();}
 else if(t.dataset.s&&t.classList.contains('card')){openDetail(t.dataset.s);}
 else if(t.dataset.grp){S.grp=t.dataset.grp;S.img=null;renderDetail();}
 else if(t.dataset.img){S.img=t.dataset.img;renderDetail();}
 else if(t.dataset.for){S.useFor=t.dataset.for;renderDetail();}
 else if(t.dataset.p&&t.classList.contains('pchip')){S.pal=t.dataset.p;if(S.pal==='orig'||S.pal==='brand'){S.light=0;S.sat=0;}if(S.pal!=='brand')S.hex=[];renderDetail();writeHash();}
 else if(t.dataset.k){S[t.dataset.k]=+t.dataset.v;renderDetail();writeHash();}
 else if(t.dataset.try){const card=t.closest('.pcard'),box=card.querySelector('.pprev'),p=pal(t.dataset.try);
  if(!box.hidden){box.hidden=true;return;}
  box.hidden=false;box.innerHTML=TRY_STYLES().map(c=>'<img alt="" src="'+IMG(c.id,'s1')+'">').join('');
  box.querySelectorAll('img').forEach(im=>tintOnLoad(im,p.colors,0,0));}
 else if(t.dataset.usepal){S.pal=t.dataset.usepal;S.light=0;S.sat=0;S.hex=[];renderPals();writeHash();toast('已选用「'+pal(S.pal).name+'」，回到「选画风」点开任意画风就会默认选中它');}
 else if(t.dataset.rm){delete mine[t.dataset.rm];saveMine();renderHead();renderTray();renderGrids();}
 else if(t.id==='dlgX')closeDetail();
 else if(t.id==='btnOnce'){copy(onceText(),'已复制，只用这一次');}
 else if(t.id==='btnDefault'){saveDefault();}
 else if(t.id==='trayBtn')openTray(true);
 else if(t.id==='tClose')openTray(false);
 else if(t.id==='tCopy'){copy(defaultsText(),'已复制，发给 Agent 即可');}
 else if(t.id==='tClear'){if(confirm('清空「我的默认」？')){mine={};saveMine();renderHead();renderTray();renderGrids();}}});
$('scrim').addEventListener('click',()=>openTray(false));
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))closeDetail();});
$('dlg').addEventListener('cancel',()=>{S.sel=null;writeHash();});
$('q').addEventListener('input',e=>{S.q=e.target.value;renderGrids();});
$('hex').addEventListener('input',e=>{S.hex=e.target.value.replace(/#/g,'').split(/[\s,]+/).filter(x=>/^[0-9A-Fa-f]{6}$/.test(x)).map(x=>x.toUpperCase()).slice(0,5);renderCodeBar();writeHash();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('tray').classList.contains('open'))openTray(false);});
function boot(){readHash();if(!S.scene&&S.angle==='use')S.angle='s1';renderAll();if(S.sel){S.useFor=S.scene;openDetail(S.sel);}else if($('dlg').open)$('dlg').close();}
window.addEventListener('hashchange',boot);boot();
</script>
</body>
